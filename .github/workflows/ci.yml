name: Verify InvoiceIQ
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      INVOICEIQ_TEST_DATABASE_URL: postgresql+psycopg://invoiceiq:invoiceiq_test@127.0.0.1:5432/invoiceiq_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invoiceiq
          POSTGRES_PASSWORD: invoiceiq_test
          POSTGRES_DB: invoiceiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceiq -d invoiceiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng
      - name: Test API and migrations
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m alembic upgrade head
          python -m alembic check
          DATABASE_URL="$INVOICEIQ_TEST_DATABASE_URL" python -m alembic upgrade head
          DATABASE_URL="$INVOICEIQ_TEST_DATABASE_URL" python -m alembic check
          python -m pytest -q
      - name: Build frontend and test browser workflows
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          export INVOICEIQ_BROWSER_DATABASE_URL="$INVOICEIQ_TEST_DATABASE_URL"
          npx playwright test
          export INVOICEIQ_TEST_TLS_DIR="$RUNNER_TEMP/invoiceiq-tls"
          mkdir -p "$INVOICEIQ_TEST_TLS_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' -keyout "$INVOICEIQ_TEST_TLS_DIR/key.pem" -out "$INVOICEIQ_TEST_TLS_DIR/cert.pem"
          npx playwright test
      - name: Build and smoke-test Render image
        run: |
          docker build -f backend/Dockerfile -t invoiceiq-ci .
          docker run --rm -i --entrypoint python -e INVOICEIQ_PUBLIC_DEMO=0 invoiceiq-ci - <<'PY'
          import os
          from pathlib import Path
          import pymupdf
          from app.main import SAMPLE
          from app.extraction import read_document

          assert os.getuid() != 0
          assert Path(os.environ["TESSDATA_PREFIX"], "eng.traineddata").is_file()
          with pymupdf.open(stream=SAMPLE, filetype="pdf") as document:
              image = document[0].get_pixmap(dpi=180).tobytes("png")
          assert read_document(image)["fields"]["number"] == "JS-1042"
          PY
